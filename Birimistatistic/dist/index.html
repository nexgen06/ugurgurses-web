      33% { transform: translate(30px, -50px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.9); }

    .animation-delay-2000 {
      animation-delay: 2s;
    }
    .font-imza { font-family: 'Dancing Script', cursive; }
    @keyframes blink {
      0%, 50%, 100% { opacity: 1; }

    /* Kaydırma çubukları — açık / koyu mod uyumu */
