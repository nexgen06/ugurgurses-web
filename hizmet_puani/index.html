<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hizmet Puanı Hesaplama (Kompakt)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
            filter: invert(1);
        }

        .gradient-bg {
            background: linear-gradient(135deg, #4F46E5 0%, #3b82f6 100%);
        }

        /* Küçük ekranlarda kaydırmayı engellemek için */
        @media (min-width: 1024px) {
            body {
                overflow: hidden;
            }
        }
    </style>
</head>

<body class="bg-slate-100 h-screen w-full flex flex-col items-center justify-center p-4">

    <div
        class="w-full max-w-6xl bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden flex flex-col lg:flex-row h-auto lg:h-[600px]">

        <div class="w-full lg:w-5/12 bg-white flex flex-col relative z-10">
            <div class="bg-indigo-600 p-5 flex items-center gap-3 shrink-0">
                <i class="fa-solid fa-calculator text-white text-xl"></i>
                <div>
                    <h1 class="text-white font-bold text-lg leading-tight">Hizmet Puanı</h1>
                    <p class="text-indigo-200 text-xs">Hesaplama Parametreleri</p>
                </div>
            </div>

            <div class="p-6 flex flex-col gap-5 justify-center h-full">

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-xs font-bold text-slate-500 mb-1.5 block">İl Puanı</label>
                        <div class="relative">
                            <span class="absolute left-3 top-2.5 text-indigo-500"><i
                                    class="fa-solid fa-location-dot"></i></span>
                            <input type="number" id="ilPuan" value="90"
                                class="w-full pl-9 p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700 font-semibold transition"
                                placeholder="90">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 mb-1.5 block">İlçe Puanı</label>
                        <div class="relative">
                            <span class="absolute left-3 top-2.5 text-indigo-500"><i
                                    class="fa-solid fa-map-pin"></i></span>
                            <input type="number" id="ilcePuan" value="1100"
                                class="w-full pl-9 p-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-slate-700 font-semibold transition"
                                placeholder="1100">
                        </div>
                    </div>
                </div>

                <div class="bg-slate-900 rounded-xl p-5 space-y-4 shadow-inner">
                    <div>
                        <label class="text-xs font-bold text-slate-400 mb-1 block uppercase">Başlangıç Tarihi</label>
                        <input type="date" id="startDate" value="2025-02-15"
                            class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white focus:border-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-400 mb-1 block uppercase">Bitiş Tarihi</label>
                        <input type="date" id="endDate" value="2026-01-01"
                            class="w-full bg-slate-800 border border-slate-700 rounded-lg p-2.5 text-white focus:border-indigo-500 outline-none">
                    </div>
                </div>

                <button onclick="hesapla()"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-200 transition transform active:scale-95 flex justify-center items-center gap-2 mt-auto">
                    Hesapla <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <div class="w-full lg:w-7/12 bg-slate-50 p-6 flex flex-col gap-4 border-l border-slate-200 overflow-y-auto">

            <div
                class="gradient-bg rounded-2xl shadow-lg p-6 text-white relative overflow-hidden flex items-center justify-between shrink-0">
                <div class="absolute right-0 top-0 h-full w-1/2 bg-white opacity-5 transform skew-x-12"></div>

                <div>
                    <div class="flex items-center gap-2 opacity-90 mb-1">
                        <i class="fa-solid fa-medal"></i>
                        <span class="text-sm font-medium">Toplam Hizmet Puanı</span>
                    </div>
                    <div class="text-5xl font-bold tracking-tight" id="totalScoreDisplay">0,00</div>
                </div>

                <div class="text-right">
                    <div class="text-3xl font-bold opacity-20"><i class="fa-solid fa-trophy"></i></div>
                    <div class="text-xs opacity-80 mt-2" id="totalDaysText">... Gün</div>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4 shrink-0">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-bold text-slate-400 uppercase">Yıllık Puan</span>
                        <i class="fa-solid fa-arrow-trend-up text-green-500 bg-green-50 p-1.5 rounded-md"></i>
                    </div>
                    <div class="text-2xl font-bold text-slate-800" id="yearlyScoreDisplay">0</div>
                </div>

                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-xs font-bold text-slate-400 uppercase">Günlük Puan</span>
                        <i class="fa-solid fa-chart-pie text-blue-500 bg-blue-50 p-1.5 rounded-md"></i>
                    </div>
                    <div class="text-2xl font-bold text-slate-800" id="dailyScoreDisplay">0</div>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4 shrink-0">
                <div class="bg-orange-50 p-3 rounded-lg text-orange-500">
                    <i class="fa-regular fa-clock text-xl"></i>
                </div>
                <div>
                    <span class="text-xs font-bold text-slate-400 uppercase block">Hizmet Süresi</span>
                    <span class="text-lg font-bold text-slate-800" id="durationDisplay">0 Yıl, 0 Ay, 0 Gün</span>
                </div>
            </div>

            <div
                class="mt-auto bg-white border border-slate-200 rounded-lg p-3 flex justify-between items-center text-xs text-slate-500">
                <div>
                    <i class="fa-regular fa-calendar-alt mr-1"></i> <span id="dateRangeDisplay">-</span>
                </div>
                <div class="font-mono bg-slate-100 px-2 py-1 rounded">
                    (İl + İlçe) / 365 * (Gün+1)
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', hesapla);

        function hesapla() {
            const ilPuan = parseFloat(document.getElementById('ilPuan').value) || 0;
            const ilcePuan = parseFloat(document.getElementById('ilcePuan').value) || 0;
            const startDateVal = document.getElementById('startDate').value;
            const endDateVal = document.getElementById('endDate').value;

            if (!startDateVal || !endDateVal) return;

            const start = new Date(startDateVal);
            const end = new Date(endDateVal);
            start.setHours(0, 0, 0, 0);
            end.setHours(0, 0, 0, 0);

            const diffTime = end.getTime() - start.getTime();
            // Analiz edilen formül: Gün farkı + 1
            const totalDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;

            if (totalDays < 0) {
                alert("Hata: Bitiş tarihi başlangıçtan önce olamaz.");
                return;
            }

            const yearlyScore = ilPuan + ilcePuan;
            const dailyScore = yearlyScore / 365;
            const totalScore = dailyScore * totalDays;

            const formatter = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const dailyFormatter = new Intl.NumberFormat('tr-TR', { minimumFractionDigits: 4, maximumFractionDigits: 4 });

            document.getElementById('totalScoreDisplay').innerText = formatter.format(totalScore);
            document.getElementById('totalDaysText').innerText = `${totalDays} Gün`;
            document.getElementById('yearlyScoreDisplay').innerText = new Intl.NumberFormat('tr-TR').format(yearlyScore);
            document.getElementById('dailyScoreDisplay').innerText = dailyFormatter.format(dailyScore);

            const dateOptions = { year: 'numeric', month: '2-digit', day: '2-digit' };
            document.getElementById('dateRangeDisplay').innerText =
                `${start.toLocaleDateString('tr-TR', dateOptions)} - ${end.toLocaleDateString('tr-TR', dateOptions)}`;

            calculateDetailedDuration(start, end);
        }

        function calculateDetailedDuration(start, end) {
            let years = end.getFullYear() - start.getFullYear();
            let months = end.getMonth() - start.getMonth();
            let days = end.getDate() - start.getDate();

            if (days < 0) {
                months--;
                let prevMonth = new Date(end.getFullYear(), end.getMonth(), 0);
                days += prevMonth.getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }
            document.getElementById('durationDisplay').innerHTML = `${years} Yıl, ${months} Ay, ${days} Gün`;
        }
    </script>
</body>

</html>
